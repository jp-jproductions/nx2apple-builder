
name: Test Apple Silicon Mac

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26

    steps:
      - name: Check Mac architecture
        run: |
          echo "Architecture:"
          uname -m

          echo "macOS version:"
          sw_vers

          echo "Disk space:"
          df -h /

      - name: Check Xcode
        run: |
          xcodebuild -version
          xcodebuild -showsdks

      - name: Check available memory
        run: |
          sysctl hw.memsize
