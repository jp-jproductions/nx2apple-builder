
      - name: Check Windows connection
        env:
          SERVER_IP: ${{ vars.BOTW_SERVER_IP }}
        run: |
          set -euo pipefail

          if [ -z "$SERVER_IP" ]; then
            echo "ERROR: BOTW_SERVER_IP is empty"
            exit 1
          fi

          echo "Windows IP: $SERVER_IP"

          tailscale ping "$SERVER_IP"

          nc -vz -G 10 "$SERVER_IP" 8765

          echo "Connection successful"
