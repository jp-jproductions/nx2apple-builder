
name: Diagnose Private Connection

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: xcode-27

    steps:
      - name: Show runner information
        run: |
          uname -a
          sw_vers

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Check Tailscale connection
        env:
          SERVER_IP: ${{ vars.BOTW_SERVER_IP }}
        run: |
          set -x

          tailscale status
          tailscale ip -4

          echo "Testing Windows IP..."

          tailscale ping --timeout=10s "$SERVER_IP" || true

      - name: Check HTTP port
        env:
          SERVER_IP: ${{ vars.BOTW_SERVER_IP }}
        run: |
          nc -vz -G 10 "$SERVER_IP" 8765
